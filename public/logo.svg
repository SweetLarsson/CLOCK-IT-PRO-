<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#083344" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container with Official Gradient -->
  <rect width="512" height="512" rx="112" fill="url(#appLogoGrad)" filter="url(#logoShadow)" />
  
  <!-- Subtle inner border highlight -->
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" />

  <!-- Official QR Code Emblem (Exact Lucide Geometry) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(100, 100) scale(13)">
    <!-- Top-left finder box -->
    <rect width="5" height="5" x="3" y="3" rx="1" stroke-width="2" />
    <!-- Top-right finder box -->
    <rect width="5" height="5" x="16" y="3" rx="1" stroke-width="2" />
    <!-- Bottom-left finder box -->
    <rect width="5" height="5" x="3" y="16" rx="1" stroke-width="2" />
    <!-- Bottom-right pattern -->
    <path d="M21 16h-3a2 2 0 0 0-2 2v3" stroke-width="2" />
    <path d="M21 21v.01" stroke-width="2" />
    <!-- Center data pattern -->
    <path d="M12 7v3a2 2 0 0 1-2 2H7" stroke-width="2" />
    <path d="M3 12h.01" stroke-width="2" />
    <path d="M12 3h.01" stroke-width="2" />
    <path d="M12 16v.01" stroke-width="2" />
    <path d="M16 12h1" stroke-width="2" />
    <path d="M21 12v.01" stroke-width="2" />
    <path d="M12 21v-1" stroke-width="2" />
  </g>
</svg>
